schema_version: 1
project:
  name: payment-service
  group_id: com.example
  artifact_id: payment-service
  base_package: com.example.payment
  version: 0.1.0-SNAPSHOT
  description: Payment processing service
runtime:
  language: java
  java_version: 21
  framework: spring
  framework_version: "3.5.16"
  build_tool: maven
architecture:
  type: HEXAGONAL
  enforce_boundaries: true
features:
  database: postgresql
  persistence: jpa
  migrations: flyway
  security: jwt
  messaging: none
  cache: none
  observability: standard
  openapi: true
  docker: true
  tests: true
modules:
  - payment
api_gateway:
  enabled: true
  route_path: /gateway/**
  upstream_uri: http://localhost:8081
  strip_prefix: true
  require_authentication: true
  rate_limiting: true
  requests_per_minute: 120
  max_request_bytes: 10485760
  max_header_bytes: 16384
  trusted_proxies: 127\.0\.0\.1|::1
