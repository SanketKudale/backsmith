name: Bug report
description: Report reproducible incorrect behavior in Backsmith.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Backsmith. Do not include credentials, tokens, or private source code.
  - type: input
    id: version
    attributes:
      label: Backsmith version
      description: Output from `backsmith --version`.
      placeholder: "0.1.1"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Provide the command with secrets and private paths removed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include concise output or a minimal reproduction.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets and private source code.
          required: true
        - label: I checked for an existing issue.
          required: true
