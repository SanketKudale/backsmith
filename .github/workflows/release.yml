name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or repair
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate tag and project version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Release tag '$RELEASE_TAG' is not a supported semantic version tag."
            exit 1
          }
          chmod +x mvnw
          project_version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout | tail -n 1)
          if [[ "v${project_version}" != "$RELEASE_TAG" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match Maven project version $project_version."
            exit 1
          fi

      - name: Build and verify distributions
        run: ./mvnw -B -ntp clean verify

      - name: Configure Maven Central credentials
        if: env.CENTRAL_USERNAME != '' && env.CENTRAL_PASSWORD != '' && env.MAVEN_GPG_PRIVATE_KEY != '' && env.MAVEN_GPG_PASSPHRASE != ''
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ env.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish libraries to Maven Central
        if: env.CENTRAL_USERNAME != '' && env.CENTRAL_PASSWORD != '' && env.MAVEN_GPG_PRIVATE_KEY != '' && env.MAVEN_GPG_PASSPHRASE != ''
        run: ./mvnw -B -ntp -Prelease-central -DskipTests deploy

      - name: Stage public release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          cp backsmith-cli/target/backsmith.jar dist/backsmith.jar
          cp "backsmith-cli/target/backsmith-${version}-bin.zip" dist/backsmith.zip
          cp "backsmith-cli/target/backsmith-${version}-bin.tar.gz" dist/backsmith.tar.gz
          cp distribution/install.sh dist/install.sh
          cp distribution/install.ps1 dist/install.ps1
          (
            cd dist
            sha256sum backsmith.jar backsmith.zip backsmith.tar.gz install.sh install.ps1 > SHA256SUMS
          )

      - name: Publish or repair GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Backsmith ${RELEASE_TAG#v}" \
              --generate-notes
          fi

      - name: Publish release summary
        shell: bash
        run: |
          {
            echo "### Backsmith ${RELEASE_TAG#v}"
            echo
            echo "Published executable JAR, Windows/macOS/Linux archives, and SHA-256 checksums."
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
